name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: npm run check runs the .check.ts scripts under plain node,
      # which needs native TypeScript type-stripping (Node >= 22.6).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: the lockfile is committed, so the deployed bundle is
      # built from exactly the versions that were tested.
      - name: Install dependencies
        working-directory: web
        run: npm ci

      # ci.yml already gated the pull request. Repeated here because this
      # workflow also runs on a direct push to main and on workflow_dispatch,
      # neither of which passes through that gate.
      - name: Self-checks
        working-directory: web
        run: npm run check

      - name: Tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
