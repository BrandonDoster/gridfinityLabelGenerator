<svg viewBox="0 0 793.70079 1122.5197" width="793.70079" height="1122.5197" xmlns="http://www.w3.org/2000/svg">
  <desc>Robertson (square-drive) screw head — head ring + square drive, filled for both 2D preview and 3D extrude.</desc>
